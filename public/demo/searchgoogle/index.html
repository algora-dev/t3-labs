<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Traditional Search - Example</title>
  <link rel="stylesheet" href="/demo/searchgoogle/styles.css">
</head>
<body class="search-page">
  <div class="demo-label">Example search · not live results</div>

  <header class="search-header">
    <div class="search-shell">
      <div class="search-head-row">
        <div class="search-mark"><span class="search-mark-icon"></span><span>Search</span></div>
        <form id="form" class="search-form">
          <input id="q" autocomplete="off" spellcheck="false" aria-label="Search query">
          <button class="search-action" aria-label="Search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4.1 4.1"></path>
            </svg>
          </button>
        </form>
      </div>
      <nav class="search-tabs">
        <span class="active">All</span><span>Images</span><span>Maps</span><span>News</span><span>Videos</span><span>More</span>
      </nav>
    </div>
  </header>
  <div id="status" class="search-status"><span></span></div>

  <main class="search-results-wrap">
    <div id="results" class="search-column">
      <div class="search-placeholder">Enter a search above.</div>
    </div>
  </main>

  <div class="record-hint">
    <span><b>D</b> auto demo</span>
    <span><b>R</b> reset</span>
    <span><b>Click Apex</b> to continue</span>
  </div>

  <script src="/demo/searchgoogle/config.js"></script>
  <script>
    const q = document.getElementById('q');
    const form = document.getElementById('form');
    const results = document.getElementById('results');
    const status = document.getElementById('status');

    function apexUrl(){
      return new URLSearchParams(location.search).get('target') || DEMO_CONFIG.apexTargetUrl;
    }

    function initials(name){
      return name.split(/\s+/).slice(0,2).map(s=>s[0]).join('').toUpperCase();
    }

    function esc(s){
      return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    function reset(){
      q.value = "";
      results.innerHTML = '<div class="search-placeholder">Enter a search above.</div>';
      status.classList.remove('loading');
      q.focus();
    }

    function submitSearch(query){
      if(!query.trim()) return;
      status.classList.remove('loading');
      void status.offsetWidth;
      status.classList.add('loading');
      results.innerHTML = '';
      setTimeout(()=>render(query), DEMO_CONFIG.timings.searchDelay);
    }

    function render(query){
      status.classList.remove('loading');
      results.innerHTML = `<div class="result-meta">About 12,700 results <span style="margin-left:7px">(${(0.41 + Math.random()*.11).toFixed(2)} seconds)</span></div>`;
      DEMO_CONFIG.searchResults.forEach((r,i)=>{
        const item = document.createElement('article');
        item.className = 'result rise';
        item.style.animationDelay = `${i*65}ms`;
        item.innerHTML = `
          <div class="result-topline">
            <div class="favicon">${initials(r.site)}</div>
            <div>
              <div class="result-site">${esc(r.site)}</div>
              <div class="result-url">https://${esc(r.host)}/${esc(r.path)}</div>
            </div>
          </div>
          <a class="result-title" href="${r.apex ? apexUrl() : '#'}">${esc(r.title)}</a>
          <div class="result-desc">${esc(r.description)}</div>`;
        const link = item.querySelector('.result-title');
        if(!r.apex) link.addEventListener('click',e=>e.preventDefault());
        results.appendChild(item);
      });
    }

    async function typeText(el,text){
      el.value = '';
      el.focus();
      for(const ch of text){
        el.value += ch;
        const min=DEMO_CONFIG.timings.typeMin, max=DEMO_CONFIG.timings.typeMax;
        await new Promise(r=>setTimeout(r,min+Math.random()*(max-min)));
      }
    }

    async function autoDemo(){
      reset();
      await new Promise(r=>setTimeout(r,280));
      await typeText(q,DEMO_CONFIG.searchPreset);
      await new Promise(r=>setTimeout(r,220));
      submitSearch(q.value);
    }

    form.addEventListener('submit',e=>{e.preventDefault();submitSearch(q.value)});
    document.addEventListener('keydown',e=>{
      if(e.key.toLowerCase()==='d' && document.activeElement!==q){e.preventDefault();autoDemo()}
      if(e.key.toLowerCase()==='r' && document.activeElement!==q){e.preventDefault();reset()}
    });
    q.focus();
  </script>
</body>
</html>
