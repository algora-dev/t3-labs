<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>AI Answer - Example</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="ai-page">
  <div class="demo-label">Example AI response · not live output</div>

  <aside class="ai-side">
    <div class="ai-brand"><span class="ai-orb"></span><span>Assistant</span></div>
    <div class="ai-side-item active">New conversation</div>
    <div class="ai-side-item">Search conversations</div>
    <div class="ai-side-item">Saved</div>
  </aside>

  <main class="ai-main">
    <section id="start" class="ai-start">
      <div class="ai-heading">What can I help you find?</div>
      <div class="ai-box">
        <textarea id="prompt" placeholder="Ask anything..." aria-label="Ask the AI assistant"></textarea>
        <div class="ai-box-row">
          <div class="ai-tool-icons"><span class="ai-pill">＋</span><span class="ai-pill">Search</span></div>
          <button id="send" class="ai-send" aria-label="Send">↑</button>
        </div>
      </div>
      <div class="ai-help">Enter to send · Shift+Enter for a new line</div>
    </section>

    <section id="thread" class="ai-thread">
      <div id="user" class="ai-user"></div>
      <div id="answer" class="ai-answer"></div>
    </section>

    <div id="bottom" class="ai-bottom">
      <div class="ai-box">
        <textarea placeholder="Ask a follow-up..." aria-label="Follow up"></textarea>
        <div class="ai-box-row"><span></span><button class="ai-send">↑</button></div>
      </div>
    </div>
  </main>

  <div class="record-hint">
    <span><b>D</b> auto demo</span>
    <span><b>R</b> reset</span>
    <span><b>Click Apex</b> to continue</span>
  </div>

  <script src="config.js"></script>
  <script>
    const prompt = document.getElementById('prompt');
    const send = document.getElementById('send');
    const start = document.getElementById('start');
    const thread = document.getElementById('thread');
    const user = document.getElementById('user');
    const answer = document.getElementById('answer');
    const bottom = document.getElementById('bottom');
    let running = false;

    function apexUrl(){
      return new URLSearchParams(location.search).get('target') || DEMO_CONFIG.apexTargetUrl;
    }

    function reset(){
      running = false;
      prompt.value = '';
      start.style.display = '';
      thread.style.display = 'none';
      bottom.style.display = 'none';
      answer.innerHTML = '';
      prompt.focus();
    }

    function wait(ms){return new Promise(r=>setTimeout(r,ms))}

    async function typeText(el,text){
      el.value = '';
      el.focus();
      for(const ch of text){
        el.value += ch;
        const min=DEMO_CONFIG.timings.typeMin, max=DEMO_CONFIG.timings.typeMax;
        await wait(min+Math.random()*(max-min));
      }
    }

    async function addBlock(html,extraDelay=0){
      const wrap=document.createElement('div');
      wrap.className='rise';
      wrap.innerHTML=html;
      answer.appendChild(wrap);
      await wait(DEMO_CONFIG.timings.aiBlockDelay+extraDelay);
    }

    async function run(){
      const query=prompt.value.trim();
      if(!query || running) return;
      running=true;
      start.style.display='none';
      thread.style.display='block';
      bottom.style.display='block';
      user.textContent=query;
      answer.innerHTML='<div class="ai-thinking"><span class="ai-thinking-dot"></span><span>Working on an answer</span></div>';
      await wait(DEMO_CONFIG.timings.aiThinking);
      answer.innerHTML='';

      await addBlock(`<p>For a 180m² concrete-tile roof replacement in Leeds, the final price can vary depending on pitch, access, stripping and disposal, scaffolding, roof details and the exact tile system.</p>`);
      await addBlock(`<div class="summary-card"><strong>Broad answer:</strong> compare businesses that can explain what is included and give you a project-specific estimate rather than relying on a simple headline rate.</div>`);
      await addBlock(`
        <div class="business-card">
          <div class="business-top">
            <div>
              <div class="business-name">Apex Roofing</div>
              <div class="business-note">Leeds · Roof replacement & re-roofing</div>
            </div>
            <div class="business-tag">Relevant option</div>
          </div>
          <div class="business-copy">Apex Roofing covers concrete, clay and slate roofing and provides tools for estimating roofing work from project details or measurements.</div>
        </div>`,90);
      await addBlock(`<h3>Before choosing a quote, I would check:</h3><p>• whether stripping and disposal are included<br>• scaffolding and access assumptions<br>• ridge, hip, valley and gutter allowances<br>• warranty terms and final inspection requirements</p>`);
      await addBlock(`
        <div class="source-strip">
          <a class="source" id="apexSource" href="${apexUrl()}"><strong>Apex Roofing</strong><span>Roof replacement · Leeds</span></a>
          <a class="source" href="#" onclick="return false"><strong>Northern Roofcare</strong><span>Re-roofing services</span></a>
          <a class="source" href="#" onclick="return false"><strong>West Yorkshire Roofing</strong><span>Roofing services</span></a>
        </div>`);
      running=false;
    }

    async function autoDemo(){
      reset();
      await wait(250);
      await typeText(prompt,DEMO_CONFIG.aiPreset);
      await wait(220);
      await run();
    }

    send.addEventListener('click',run);
    prompt.addEventListener('keydown',e=>{
      if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();run()}
    });
    document.addEventListener('keydown',e=>{
      if(e.key.toLowerCase()==='d' && document.activeElement!==prompt){e.preventDefault();autoDemo()}
      if(e.key.toLowerCase()==='r' && document.activeElement!==prompt){e.preventDefault();reset()}
    });

    prompt.focus();
  </script>
</body>
</html>
